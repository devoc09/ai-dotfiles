# Place AI agent configuration and skills at each tool's expected path.
# The repository holds the source of truth and exposes it through symlinks.

[tasks.setup]
description = "Set up Pi configuration and skills"
depends = ["link", "skills"]

# Link Pi configuration and the owned skill (the repository holds the content)
[tasks.link]
description = "Symlink Pi configuration and the owned skill"
run = """
mkdir -p "$HOME/.pi/agent" "$HOME/.agents/skills"
ln -sf  "$MISE_PROJECT_ROOT/pi/settings.json"    "$HOME/.pi/agent/settings.json"
ln -sf  "$MISE_PROJECT_ROOT/pi/keybindings.json" "$HOME/.pi/agent/keybindings.json"
ln -sf  "$MISE_PROJECT_ROOT/pi/AGENTS.md"        "$HOME/.pi/agent/AGENTS.md"
# ln -sfn cannot replace an existing real directory and would nest a symlink inside it
rm -rf "$HOME/.agents/skills/finding-vim-patches"
ln -sfn "$MISE_PROJECT_ROOT/skills/finding-vim-patches" "$HOME/.agents/skills/finding-vim-patches"
"""

# Let gh skill own installation and updates for non-owned skills (~/.pi/agent/skills)
[tasks.skills]
description = "Install non-owned skills for Pi via gh skill"
run = """
# gh skill install exits non-zero when a skill already exists, so check first
have() { gh skill list --agent pi --json skillName -q '.[].skillName' | grep -qx "$1"; }
have eli5        || gh skill install DreambigOu/ELI5         eli5        --agent pi --scope user
have explainer   || gh skill install mizchi/explainer        explainer   --agent pi --scope user
have ponytail    || gh skill install DietrichGebert/ponytail --all       --agent pi --scope user
have i-have-adhd || gh skill install ayghri/i-have-adhd      i-have-adhd --agent pi --scope user
"""

[tasks."skills:update"]
description = "Update gh skill-managed skills"
run = "gh skill update --all"

# Optional: expose the owned skill to Claude Code / opencode too
[tasks."link:claude"]
description = "Also link the owned skill for Claude Code / opencode"
run = """
mkdir -p "$HOME/.claude/skills"
# ln -sfn cannot replace an existing real directory and would nest a symlink inside it
rm -rf "$HOME/.claude/skills/finding-vim-patches"
ln -sfn "$MISE_PROJECT_ROOT/skills/finding-vim-patches" "$HOME/.claude/skills/finding-vim-patches"
"""
